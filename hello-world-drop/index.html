<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    :root {
      --bg: #0b1220;
      --fg: #f4f7fb;
      --accent: #f6821f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--fg);
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(246, 130, 31, 0.35), transparent 55%),
        radial-gradient(ellipse 70% 50% at 80% 80%, rgba(59, 130, 246, 0.2), transparent 50%),
        var(--bg);
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0;
      font-size: 1.125rem;
      opacity: 0.85;
    }
    .accent { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Hello <span class="accent">World</span></h1>
    <p>Deployed with Cloudflare Drop</p>
  </main>
</body>
</html>
